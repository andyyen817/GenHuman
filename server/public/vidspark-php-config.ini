; Vidspark PHP配置覆蓋文件
; 如果環境變量無法生效，使用此文件強制設置PHP配置

; 文件上傳限制
upload_max_filesize = 1000M
post_max_size = 1100M
max_file_uploads = 20
file_uploads = On

; 內存和執行時間
memory_limit = 2048M
max_execution_time = 1800
max_input_time = 1800
max_input_vars = 10000

; 錯誤報告
display_errors = Off
log_errors = On

; 會話設置
session.gc_maxlifetime = 7200

; 其他重要設置
default_charset = "UTF-8"
date.timezone = "Asia/Taipei"

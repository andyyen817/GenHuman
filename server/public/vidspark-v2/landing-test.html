<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidspark - AI影片創作平台 (測試頁面)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Vidspark i18n支持 -->
    <script src="assets/i18n-test.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .hero-gradient {
            background: linear-gradient(135deg, #5D5FEF 0%, #A78BFA 100%);
        }
        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(93, 95, 239, 0.15);
        }
        .floating-animation {
            animation: float 6s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        .pulse-animation {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>
</head>
<body class="bg-white">
    <!-- 導航欄 -->
    <nav class="bg-white/95 backdrop-blur-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <div class="flex-shrink-0 flex items-center">
                        <div class="w-8 h-8 bg-gradient-to-r from-purple-600 to-blue-600 rounded-lg flex items-center justify-center mr-3">
                            <i class="fas fa-video text-white text-sm"></i>
                        </div>
                        <span class="text-xl font-bold text-gray-900">Vidspark</span>
                    </div>
                </div>

                <!-- 導航連結 -->
                <div class="hidden md:block">
                    <div class="ml-10 flex items-baseline space-x-8">
                        <a href="#features" class="text-gray-900 hover:text-purple-600 px-3 py-2 text-sm font-medium transition-colors" data-i18n="features" data-default="功能特色">功能特色</a>
                        <a href="#pricing" class="text-gray-900 hover:text-purple-600 px-3 py-2 text-sm font-medium transition-colors" data-i18n="pricing" data-default="定價方案">定價方案</a>
                        <a href="about.html" class="text-gray-900 hover:text-purple-600 px-3 py-2 text-sm font-medium transition-colors" data-i18n="aboutUs" data-default="關於我們">關於我們</a>
                        <a href="#" class="text-gray-900 hover:text-purple-600 px-3 py-2 text-sm font-medium transition-colors" data-i18n="helpSupport" data-default="幫助支援">幫助支援</a>
                    </div>
                </div>

                <!-- 右側按鈕組 -->
                <div class="flex items-center space-x-4">
                    <a href="login.html" class="text-gray-900 hover:text-purple-600 px-3 py-2 text-sm font-medium transition-colors" data-i18n="loginButton" data-default="登入">登入</a>
                    <a href="register.html" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors" data-i18n="freeRegister" data-default="免費註冊">免費註冊</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero-gradient text-white pt-20 pb-32 relative overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
            <h1 class="text-3xl sm:text-4xl lg:text-5xl xl:text-6xl font-bold text-gray-900 mb-6 leading-tight text-center">
                <span data-i18n="mainTitle" data-default="你的">你的</span>
                <span class="bg-gradient-to-r from-purple-600 to-blue-600 bg-clip-text text-transparent" data-i18n="aiVideoTeam" data-default="AI 影片團隊">AI 影片團隊</span><span data-i18n="easyCreation" data-default="，讓創意輕鬆實現">，讓創意輕鬆實現</span>
            </h1>
            
            <p class="text-xl sm:text-2xl text-gray-600 mb-8 max-w-3xl mx-auto leading-relaxed" data-i18n="heroSubtitle" data-default="無需任何經驗,你的 AI 團隊一手搞定！從發想、文案、製作到剪輯，利用最新AI工具、數位人與聲音克隆技術，輕鬆創作出專業影片。">
                無需任何經驗,你的 AI 團隊一手搞定！從發想、文案、製作到剪輯，利用最新AI工具、數位人與聲音克隆技術，輕鬆創作出專業影片。
            </p>
            
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center mb-12">
                <a href="register.html" class="bg-white text-purple-600 px-8 py-4 rounded-full text-lg font-semibold hover:bg-gray-100 transition-all transform hover:scale-105 shadow-lg" data-i18n="startCreating" data-default="開始創作">開始創作</a>
                <a href="#demo" class="border-2 border-white text-white px-8 py-4 rounded-full text-lg font-semibold hover:bg-white hover:text-purple-600 transition-all" data-i18n="watchDemo" data-default="觀看演示">觀看演示</a>
            </div>
            
            <div class="flex flex-wrap justify-center items-center gap-6 text-sm">
                <div class="flex items-center bg-white/10 backdrop-blur-sm rounded-full px-4 py-2">
                    <span class="bg-green-400 w-2 h-2 rounded-full mr-2"></span>
                    <span data-i18n="aiVideoPlatform" data-default="AI影片平台">AI影片平台</span>
                </div>
                <div class="flex items-center bg-white/10 backdrop-blur-sm rounded-full px-4 py-2">
                    <span class="bg-blue-400 w-2 h-2 rounded-full mr-2"></span>
                    <span data-i18n="comingSoon" data-default="即將推出">即將推出</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 簡化的Footer用於測試 -->
    <footer class="bg-gray-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <div class="flex justify-center items-center mb-6">
                <div class="w-8 h-8 bg-gradient-to-r from-purple-600 to-blue-600 rounded-lg flex items-center justify-center mr-3">
                    <i class="fas fa-video text-white text-sm"></i>
                </div>
                <span class="text-xl font-bold">Vidspark</span>
            </div>
            <p class="text-gray-400">© 2024 Vidspark. 版權所有。</p>
        </div>
    </footer>

    <script>
        // 初始化i18n
        document.addEventListener('DOMContentLoaded', function() {
            console.log(`[${new Date().toLocaleTimeString()}] 🚀 測試頁面初始化`);
            I18nManager().init();
        });
    </script>
</body>
</html>

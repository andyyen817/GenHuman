<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - Vidspark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* 動態粒子系統樣式 */
        .pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), 0 0 40px rgba(139, 92, 246, 0.1);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.2);
                transform: scale(1.05);
            }
        }
        
        .animate-spin-slow {
            animation: spin 20s linear infinite;
        }
        
        .animate-spin-reverse-slow {
            animation: spin 15s linear infinite reverse;
        }
        
        /* 高對比度粒子 - 金黃色到橙紅色 */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, #F59E0B, #EF4444, #F97316);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.8), 0 0 20px rgba(239, 68, 68, 0.4);
            opacity: 0.9;
        }
        
        .particle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.6), rgba(239, 68, 68, 0.3), transparent);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: glowPulse 1s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.5); }
        }
        
        /* 超快速粒子流動 - 2秒循環 */
        .from-top .particle {
            animation: flowFromTop 2s linear infinite;
        }
        
        @keyframes flowFromTop {
            0% { 
                top: -20px; 
                left: calc(var(--start-x, 10%) + var(--random-offset, 0px)); 
                opacity: 0;
                transform: scale(0.3);
            }
            10% { opacity: 0.9; transform: scale(1); }
            90% { opacity: 0.8; }
            100% { 
                top: 50%; 
                left: 50%; 
                opacity: 0;
                transform: scale(0.1);
            }
        }
        
        .from-right .particle {
            animation: flowFromRight 2s linear infinite;
        }
        
        @keyframes flowFromRight {
            0% { 
                right: -20px; 
                top: calc(var(--start-y, 10%) + var(--random-offset, 0px)); 
                opacity: 0;
                transform: scale(0.3);
            }
            10% { opacity: 0.9; transform: scale(1); }
            90% { opacity: 0.8; }
            100% { 
                right: 50%; 
                top: 50%; 
                opacity: 0;
                transform: scale(0.1);
            }
        }
        
        .from-bottom .particle {
            animation: flowFromBottom 2s linear infinite;
        }
        
        @keyframes flowFromBottom {
            0% { 
                bottom: -20px; 
                left: calc(var(--start-x, 10%) + var(--random-offset, 0px)); 
                opacity: 0;
                transform: scale(0.3);
            }
            10% { opacity: 0.9; transform: scale(1); }
            90% { opacity: 0.8; }
            100% { 
                bottom: 50%; 
                left: 50%; 
                opacity: 0;
                transform: scale(0.1);
            }
        }
        
        .from-left .particle {
            animation: flowFromLeft 2s linear infinite;
        }
        
        @keyframes flowFromLeft {
            0% { 
                left: -20px; 
                top: calc(var(--start-y, 10%) + var(--random-offset, 0px)); 
                opacity: 0;
                transform: scale(0.3);
            }
            10% { opacity: 0.9; transform: scale(1); }
            90% { opacity: 0.8; }
            100% { 
                left: 50%; 
                top: 50%; 
                opacity: 0;
                transform: scale(0.1);
            }
        }
        
        /* 漸變背景 */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        /* 表單樣式 */
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(93, 95, 239, 0.15);
        }
        
        /* 數字計數器動畫 */
        .counter-display {
            animation: fadeInUp 1s ease-out 0.5s both;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex">
    <!-- 左側表單區域 -->
    <div class="flex-1 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-20 xl:px-24">
        <div class="mx-auto w-full max-w-sm lg:w-96">
            <!-- Logo -->
            <div class="flex items-center mb-8">
                <div class="w-10 h-10 bg-gradient-to-r from-purple-600 to-blue-600 rounded-lg flex items-center justify-center mr-3">
                    <i class="fas fa-video text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Vidspark</h1>
            </div>

            <!-- 標題 -->
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-2">創建您的帳戶</h2>
                <p class="text-gray-600">開始您的 AI 影片創作之旅</p>
            </div>

            <!-- 註冊表單 -->
            <form onsubmit="return handleRegister(event)" class="space-y-6">
                <!-- 電子郵件 -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">電子郵件地址</label>
                    <div class="relative">
                        <input 
                            id="email" 
                            name="email" 
                            type="email" 
                            required 
                            class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500"
                            placeholder="輸入您的 Email"
                        >
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- 密碼 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">設定密碼</label>
                    <div class="relative">
                        <input 
                            id="password" 
                            name="password" 
                            type="password" 
                            required 
                            class="input-focus w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 pr-12"
                            placeholder="8位以上，包含字母數字"
                        >
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i class="fas fa-eye text-gray-400 hover:text-gray-600"></i>
                        </button>
                    </div>
                    <p class="mt-2 text-sm text-gray-500">密碼需求：至少8位元</p>
                </div>

                <!-- 服務條款 -->
                <div class="flex items-start">
                    <input 
                        id="terms" 
                        name="terms" 
                        type="checkbox" 
                        required 
                        class="mt-1 h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded"
                    >
                    <label for="terms" class="ml-3 text-sm text-gray-600">
                        我同意 <a href="#" class="text-purple-600 hover:text-purple-500">服務條款</a> 和 <a href="#" class="text-purple-600 hover:text-purple-500">隱私政策</a>
                    </label>
                </div>

                <!-- 註冊按鈕 -->
                <button 
                    type="submit" 
                    class="w-full bg-gradient-to-r from-purple-600 to-blue-600 text-white py-3 px-6 rounded-lg font-medium hover:from-purple-700 hover:to-blue-700 focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2 transform hover:scale-105 transition-all duration-200 shadow-lg"
                >
                    立即註冊
                </button>
            </form>

            <!-- 登入連結 -->
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    已有帳戶？ <a href="/vidspark-v2/login.html" class="text-purple-600 hover:text-purple-500 font-medium">立即登入</a>
                </p>
            </div>

            <!-- 社群媒體註冊 -->
            <div class="mt-8">
                <div class="relative">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-gray-300"></div>
                    </div>
                    <div class="relative flex justify-center text-sm">
                        <span class="px-2 bg-gray-50 text-gray-500">或使用以下方式</span>
                    </div>
                </div>

                <div class="mt-6 grid grid-cols-2 gap-3">
                    <button class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-500 bg-white hover:bg-gray-50 transition-colors duration-200">
                        <i class="fab fa-google text-red-500 mr-2"></i>
                        Google
                    </button>
                    <button class="w-full inline-flex justify-center py-3 px-4 border border-gray-300 rounded-lg shadow-sm text-sm font-medium text-gray-500 bg-white hover:bg-gray-50 transition-colors duration-200">
                        <i class="fab fa-facebook text-blue-600 mr-2"></i>
                        Facebook
                    </button>
                </div>
            </div>

            <!-- 免費功能介紹 -->
            <div class="mt-12 bg-gradient-to-r from-purple-50 to-blue-50 rounded-xl p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">立即開始免費體驗：</h3>
                <ul class="space-y-3">
                    <li class="flex items-center text-sm text-gray-700">
                        <div class="w-2 h-2 bg-purple-500 rounded-full mr-3"></div>
                        每日 3 次免費數字人影片生成
                    </li>
                    <li class="flex items-center text-sm text-gray-700">
                        <div class="w-2 h-2 bg-purple-500 rounded-full mr-3"></div>
                        1 次免費聲音克隆體驗
                    </li>
                    <li class="flex items-center text-sm text-gray-700">
                        <div class="w-2 h-2 bg-purple-500 rounded-full mr-3"></div>
                        5 個免費影片模板使用
                    </li>
                </ul>
            </div>
        </div>
    </div>

    <!-- 右側動態背景區域 -->
    <div class="hidden lg:block relative w-0 flex-1">
        <!-- 背景漸變 -->
        <div class="absolute inset-0 gradient-bg"></div>

        <!-- 動態用戶流動網絡 -->
        <div class="absolute inset-0 flex items-center justify-center overflow-hidden">
            <!-- 中央核心節點 -->
            <div class="relative w-full h-full flex items-center justify-center">
                <!-- 中央主要節點 - Vidspark平台核心 -->
                <div class="relative z-20">
                    <!-- 主核心圓圈 -->
                    <div class="w-40 h-40 bg-gradient-to-r from-purple-400 to-blue-500 rounded-full flex items-center justify-center shadow-2xl pulse-glow">
                        <div class="w-32 h-32 bg-white rounded-full flex items-center justify-center">
                            <div class="text-purple-600 text-2xl font-bold">
                                <i class="fas fa-video mr-2"></i>
                                <div class="text-sm font-medium">Vidspark</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 圍繞核心的環形軌道 -->
                    <div class="absolute inset-0 animate-spin-slow">
                        <div class="w-full h-full border-2 border-purple-300 border-opacity-30 rounded-full"></div>
                    </div>
                    <div class="absolute inset-0 animate-spin-reverse-slow" style="animation-delay: 1s;">
                        <div class="w-full h-full border border-blue-300 border-opacity-20 rounded-full"></div>
                    </div>
                </div>

                <!-- 數據統計顯示 -->
                <div class="absolute top-8 right-8 bg-white bg-opacity-90 rounded-lg p-3 shadow-lg counter-display">
                    <div class="text-center">
                        <div class="text-2xl font-bold text-purple-600 counter" data-target="24567">0</div>
                        <div class="text-xs text-gray-600">活躍創作者</div>
                    </div>
                </div>

                <!-- 1000個動態粒子流 -->
                <div class="absolute inset-0 particle-system" id="particleContainer">
                    <!-- 粒子將通過JavaScript動態生成 -->
                </div>
            </div>

            <!-- 文字覆蓋 -->
            <div class="absolute bottom-8 left-8 right-8 text-center">
                <h3 class="text-2xl font-bold text-white mb-2">加入創作者社群</h3>
                <p class="text-white/80">數萬名創作者正在準備使用 Vidspark 創造精彩內容</p>
            </div>
        </div>
    </div>

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.querySelector('.fa-eye');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const terms = document.getElementById('terms').checked;
            
            if (!terms) {
                alert('請同意服務條款和隱私政策');
                return false;
            }
            
            // 這裡可以添加註冊邏輯
            console.log('註冊嘗試:', { email, password });
            
            // 示例：註冊成功後跳轉到Vue應用
            alert('註冊成功！即將跳轉到儀表板...');
            window.location.href = '/vidspark-v2/#/dashboard';
            
            return false;
        }

        // 數字計數器動畫
        function animateCounter() {
            const counter = document.querySelector('.counter');
            if (!counter) return;
            
            const target = parseInt(counter.getAttribute('data-target'));
            const increment = target / 200; // 200步達到目標
            let current = 0;
            
            const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                counter.textContent = Math.floor(current).toLocaleString();
            }, 20);
        }

        // 生成1000個動態粒子
        function generateMassParticles() {
            const container = document.getElementById('particleContainer');
            if (!container) return;

            // 清空現有粒子
            container.innerHTML = '';

            // 生成1000個粒子
            for (let i = 0; i < 1000; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // 隨機大小 (2px到8px)
                const size = Math.random() * 6 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                
                // 隨機延遲 (0到2秒)
                const delay = Math.random() * 2;
                particle.style.animationDelay = delay + 's';
                
                // 隨機偏移量
                const randomOffset = (Math.random() - 0.5) * 200;
                particle.style.setProperty('--random-offset', randomOffset + 'px');
                
                // 隨機起始位置
                const startX = Math.random() * 80 + 10; // 10% 到 90%
                const startY = Math.random() * 80 + 10; // 10% 到 90%
                particle.style.setProperty('--start-x', startX + '%');
                particle.style.setProperty('--start-y', startY + '%');
                
                // 創建粒子流父容器
                const streamContainer = document.createElement('div');
                
                // 隨機選擇流動方向
                const directions = ['from-top', 'from-right', 'from-bottom', 'from-left'];
                const direction = directions[Math.floor(Math.random() * directions.length)];
                streamContainer.className = `particle-stream ${direction}`;
                
                streamContainer.appendChild(particle);
                container.appendChild(streamContainer);
            }
        }

        // 頁面載入時啟動所有動畫
        document.addEventListener('DOMContentLoaded', function() {
            // 啟動計數器動畫（延遲1秒）
            setTimeout(animateCounter, 1000);
            
            // 生成1000個動態粒子
            generateMassParticles();
            
            // 每10秒重新生成粒子以保持活力
            setInterval(generateMassParticles, 10000);
        });
    </script>
</body>
</html>

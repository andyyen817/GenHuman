<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidspark - 重定向到主页</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-container {
            max-width: 400px;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .logo {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 16px;
            font-weight: 600;
        }
        .message {
            color: #6b7280;
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .redirect-btn {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }
        .redirect-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }
        .countdown {
            color: #9ca3af;
            font-size: 14px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="logo">🎬 Vidspark</div>
        <div class="message">
            正在跳转到 Vidspark AI 影片创作平台...
        </div>
        <a href="/vidspark-v2/" class="redirect-btn">
            立即进入
        </a>
        <div class="countdown" id="countdown">
            3秒后自动跳转
        </div>
    </div>

    <script>
        let seconds = 3;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            seconds--;
            countdownEl.textContent = `${seconds}秒后自动跳转`;
            
            if (seconds <= 0) {
                clearInterval(timer);
                window.location.href = '/vidspark-v2/';
            }
        }, 1000);
    </script>
</body>
</html>

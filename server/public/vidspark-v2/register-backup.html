<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊 - Vidspark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* 動態粒子系統樣式 */
        .pulse-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }
        
        @keyframes pulseGlow {
            0%, 100% { 
                box-shadow: 0 0 20px rgba(139, 92, 246, 0.3), 0 0 40px rgba(139, 92, 246, 0.1);
                transform: scale(1);
            }
            50% { 
                box-shadow: 0 0 30px rgba(139, 92, 246, 0.5), 0 0 60px rgba(139, 92, 246, 0.2);
                transform: scale(1.05);
            }
        }
        
        .animate-spin-slow {
            animation: spin 20s linear infinite;
        }
        
        .animate-spin-reverse-slow {
            animation: spin 15s linear infinite reverse;
        }
        
        /* 粒子流動動畫 */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(45deg, #8B5CF6, #3B82F6);
            opacity: 0.7;
        }
        
        .particle::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.3), transparent);
            transform: translate(-50%, -50%);
            border-radius: 50%;
            animation: glowPulse 2s ease-in-out infinite;
        }
        
        @keyframes glowPulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.2); }
        }
        
        /* 從上方流入 */
        .from-top .particle {
            animation: flowFromTop 6s linear infinite;
        }
        
        @keyframes flowFromTop {
            0% { 
                top: -10px; 
                left: calc(20% + var(--random-offset, 0px)); 
                opacity: 0;
                transform: scale(0.5);
            }
            20% { opacity: 0.7; transform: scale(1); }
            80% { opacity: 0.8; }
            100% { 
                top: 50%; 
                left: 50%; 
                opacity: 0;
                transform: scale(0.2);
            }
        }
        
        /* 從右方流入 */
        .from-right .particle {
            animation: flowFromRight 6s linear infinite;
        }
        
        @keyframes flowFromRight {
            0% { 
                right: -10px; 
                top: calc(20% + var(--random-offset, 0px)); 
                opacity: 0;
                transform: scale(0.5);
            }
            20% { opacity: 0.7; transform: scale(1); }
            80% { opacity: 0.8; }
            100% { 
                right: 50%; 
                top: 50%; 
                opacity: 0;
                transform: scale(0.2);
            }
        }
        
        /* 從下方流入 */
        .from-bottom .particle {
            animation: flowFromBottom 6s linear infinite;
        }
        
        @keyframes flowFromBottom {
            0% { 
                bottom: -10px; 
                left: calc(20% + var(--random-offset, 0px)); 
                opacity: 0;
                transform: scale(0.5);
            }
            20% { opacity: 0.7; transform: scale(1); }
            80% { opacity: 0.8; }
            100% { 
                bottom: 50%; 
                left: 50%; 
                opacity: 0;
                transform: scale(0.2);
            }
        }
        
        /* 從左方流入 */
        .from-left .particle {
            animation: flowFromLeft 6s linear infinite;
        }
        
        @keyframes flowFromLeft {
            0% { 
                left: -10px; 
                top: calc(20% + var(--random-offset, 0px)); 
                opacity: 0;
                transform: scale(0.5);
            }
            20% { opacity: 0.7; transform: scale(1); }
            80% { opacity: 0.8; }
            100% { 
                left: 50%; 
                top: 50%; 
                opacity: 0;
                transform: scale(0.2);
            }
        }
        
        /* 粒子大小變化 */
        .particle-1 { width: 8px; height: 8px; animation-delay: 0s; }
        .particle-2 { width: 6px; height: 6px; animation-delay: 0.5s; }
        .particle-3 { width: 10px; height: 10px; animation-delay: 1s; }
        .particle-4 { width: 4px; height: 4px; animation-delay: 1.5s; }
        .particle-5 { width: 7px; height: 7px; animation-delay: 2s; }
        .particle-6 { width: 9px; height: 9px; animation-delay: 0.2s; }
        .particle-7 { width: 5px; height: 5px; animation-delay: 0.7s; }
        .particle-8 { width: 8px; height: 8px; animation-delay: 1.2s; }
        .particle-9 { width: 6px; height: 6px; animation-delay: 1.7s; }
        .particle-10 { width: 11px; height: 11px; animation-delay: 2.2s; }
        .particle-11 { width: 7px; height: 7px; animation-delay: 0.3s; }
        .particle-12 { width: 4px; height: 4px; animation-delay: 0.8s; }
        .particle-13 { width: 9px; height: 9px; animation-delay: 1.3s; }
        .particle-14 { width: 6px; height: 6px; animation-delay: 1.8s; }
        .particle-15 { width: 8px; height: 8px; animation-delay: 2.3s; }
        .particle-16 { width: 5px; height: 5px; animation-delay: 0.4s; }
        .particle-17 { width: 10px; height: 10px; animation-delay: 0.9s; }
        .particle-18 { width: 7px; height: 7px; animation-delay: 1.4s; }
        .particle-19 { width: 4px; height: 4px; animation-delay: 1.9s; }
        .particle-20 { width: 9px; height: 9px; animation-delay: 2.4s; }
        
        /* 舊樣式保留 */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(93, 95, 239, 0.15);
        }
        
        /* 數字計數器動畫 */
        .counter-display {
            animation: fadeInUp 1s ease-out 0.5s both;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

                        >

                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- 密碼 -->

                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        設定密碼
                    </label>

                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="new-password"

                            <div class="h-1 flex-1 bg-gray-200 rounded"></div>
                            <div class="h-1 flex-1 bg-gray-200 rounded"></div>
                        </div>
                        <p class="text-xs text-gray-500 mt-1">密碼強度：請輸入密碼</p>
                    </div>
                </div>

                <!-- 服務條款 -->

                        <input

                            name="terms"
                            type="checkbox"

                    <div class="ml-3 text-sm">

                            和

                        </label>
                    </div>
                </div>

                <!-- 提交按鈕 -->

                    <li class="flex items-center">

    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.querySelector('.fa-eye');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function handleRegister(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const terms = document.getElementById('terms').checked;
            
            if (!terms) {
                alert('請同意服務條款和隱私政策');
                return false;
            }
            
            // 這裡可以添加註冊邏輯
            console.log('註冊嘗試:', { email, password });
            
            // 示例：註冊成功後跳轉到Vue應用
            alert('註冊成功！即將跳轉到儀表板...');
            window.location.href = '/vidspark-v2/#/dashboard';
            
            return false;
        }

        // 數字計數器動畫
        function animateCounter() {
            const counter = document.querySelector('.counter');
            if (!counter) return;
            
            const target = parseInt(counter.getAttribute('data-target'));
            const increment = target / 200; // 200步達到目標
            let current = 0;
            
            const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                counter.textContent = Math.floor(current).toLocaleString();
            }, 20);
        }

        // 頁面載入時啟動所有動畫
        document.addEventListener('DOMContentLoaded', function() {
            // 啟動計數器動畫（延遲1秒）
            setTimeout(animateCounter, 1000);
            
            // 為粒子添加隨機偏移
            const particles = document.querySelectorAll('.particle');
            particles.forEach((particle, index) => {
                const randomOffset = (Math.random() - 0.5) * 100; // -50px 到 +50px
                particle.style.setProperty('--random-offset', randomOffset + 'px');
            });
        });
    </script>

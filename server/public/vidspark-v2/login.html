<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入 - Vidspark</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="assets/i18n.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .video-bg {
            background: linear-gradient(45deg, #667eea, #764ba2);
        }
        .floating-element {
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }
        .input-focus {
            transition: all 0.3s ease;
        }
        .input-focus:focus {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(93, 95, 239, 0.15);
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex">
    <!-- 左側表單區域 -->
    <div class="flex-1 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-20 xl:px-24">
        <div class="mx-auto w-full max-w-sm lg:w-96">
            <!-- Logo -->
            <div class="flex items-center mb-8">
                <div class="w-10 h-10 bg-gradient-to-r from-purple-600 to-blue-600 rounded-lg flex items-center justify-center mr-3">
                    <i class="fas fa-video text-white"></i>
                </div>
                <h1 class="text-2xl font-bold text-gray-900">Vidspark</h1>
            </div>

            <!-- 標題 -->
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-gray-900 mb-2" data-i18n="welcomeBack" data-default="歡迎回來">歡迎回來</h2>
                <p class="text-gray-600" data-i18n="loginSubtitle" data-default="登入您的帳戶繼續創作">登入您的帳戶繼續創作</p>
            </div>

            <!-- 登入表單 -->
            <form class="space-y-6" onsubmit="return handleLogin(event)">
                <!-- Email -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="emailAddress" data-default="電子郵件地址">
                        電子郵件地址
                    </label>
                    <div class="relative">
                        <input
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="email"
                            required
                            class="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg input-focus focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:z-10"
                            placeholder="輸入您的 Email"
                            data-i18n-placeholder="emailPlaceholder"
                        >
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i class="fas fa-envelope text-gray-400"></i>
                        </div>
                    </div>
                </div>

                <!-- 密碼 -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2" data-i18n="password" data-default="密碼">
                        密碼
                    </label>
                    <div class="relative">
                        <input
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                            class="appearance-none relative block w-full px-4 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-lg input-focus focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 focus:z-10"
                            placeholder="輸入您的密碼"
                            data-i18n-placeholder="passwordPlaceholder"
                        >
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                            <i class="fas fa-eye text-gray-400 cursor-pointer hover:text-gray-600" onclick="togglePassword()"></i>
                        </div>
                    </div>
                </div>

                <!-- 記住我 & 忘記密碼 -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input
                            id="remember-me"
                            name="remember-me"
                            type="checkbox"
                            class="h-4 w-4 text-purple-600 focus:ring-purple-500 border-gray-300 rounded"
                        >
                        <label for="remember-me" class="ml-2 block text-sm text-gray-600" data-i18n="rememberMe" data-default="記住我">
                            記住我
                        </label>
                    </div>
                    <div class="text-sm">
                        <a href="#" class="font-medium text-purple-600 hover:text-purple-500" data-i18n="forgotPassword" data-default="忘記密碼？">
                            忘記密碼？
                        </a>
                    </div>
                </div>

                <!-- 提交按鈕 -->
                <div>
                    <button
                        type="submit"
                        class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition-all duration-300 transform hover:scale-105"
                    >
                        <span class="absolute left-0 inset-y-0 flex items-center pl-3">
                            <i class="fas fa-sign-in-alt text-purple-500 group-hover:text-purple-400"></i>
                        </span>
                        <span data-i18n="loginNow" data-default="立即登入">立即登入</span>
                    </button>
                </div>

                <!-- 登入連結 -->
                <div class="text-center">
                    <span class="text-sm text-gray-600">
                        <span data-i18n="noAccount" data-default="還沒有帳戶？">還沒有帳戶？</span>
                        <a href="register.html" class="font-medium text-purple-600 hover:text-purple-500" data-i18n="registerNow" data-default="立即註冊">
                            立即註冊
                        </a>
                    </span>
                </div>
            </form>
        </div>
    </div>

    <!-- 右側動態背景區域 -->
    <div class="hidden lg:block relative w-0 flex-1">
        <!-- 背景漸變 -->
        <div class="absolute inset-0 video-bg"></div>

        <!-- 動態影片元素 -->
        <div class="absolute inset-0 flex items-center justify-center overflow-hidden">
            <!-- 中央大型播放器 -->
            <div class="relative z-10">
                <div class="bg-white rounded-3xl p-8 shadow-2xl max-w-md w-full mx-4">
                    <!-- 影片縮圖 - 放大版本 -->
                    <div class="relative mb-6 cursor-pointer group" onclick="playMarketingVideo()">
                        <img
                            src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=500&h=280&fit=crop"
                            alt="Vidspark AI影片創作平台演示"
                            class="w-full h-48 object-cover rounded-xl group-hover:scale-105 transition-transform duration-300"
                        >
                        <!-- 播放按鈕 - 放大版本 -->
                        <div class="absolute inset-0 flex items-center justify-center">
                            <div class="w-20 h-20 bg-white bg-opacity-95 rounded-full flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform duration-300">
                                <i class="fas fa-play text-purple-600 text-2xl ml-1"></i>
                            </div>
                        </div>
                        <!-- 時長標籤 -->
                        <div class="absolute bottom-3 right-3 bg-black bg-opacity-80 text-white text-sm px-3 py-1 rounded-lg">
                            02:15
                        </div>
                        <!-- 品質標籤 -->
                        <div class="absolute top-3 left-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white text-xs px-2 py-1 rounded-full">
                            4K HD
                        </div>
                    </div>

                    <!-- 影片信息 -->
                    <h3 class="text-xl font-bold text-gray-900 mb-2" data-i18n="productDemo" data-default="Vidspark 產品演示">Vidspark 產品演示</h3>
                    <p class="text-gray-600 mb-4" data-i18n="demoDescription" data-default="體驗 AI團隊影片創作的魅力 - 從想法到文字到專業影片只需要幾分鐘">
                        體驗 AI團隊影片創作的魅力 - 從想法到文字到專業影片只需要幾分鐘
                    </p>

                    <!-- 功能亮點 -->
                    <div class="flex items-center justify-between">
                        <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-gradient-to-r from-green-100 to-blue-100 text-green-800">
                            <i class="fas fa-magic mr-2"></i>
                            AI 驅動
                        </span>
                        <div class="flex items-center text-sm text-gray-500">
                            <i class="fas fa-eye mr-1"></i>
                            已觀看 10.2K 次
                        </div>
                    </div>
                </div>
            </div>

            <!-- 浮動創作元素 -->
            <div class="floating-element absolute top-16 left-12" style="animation-delay: 0.5s;">
                <div class="bg-white rounded-xl p-4 shadow-xl border border-purple-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-r from-purple-500 to-blue-500 rounded-xl flex items-center justify-center">
                            <i class="fas fa-user-tie text-white text-lg"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-gray-800" data-i18n="aiDigitalHuman" data-default="AI 數字人">AI 數字人</h4>
                            <p class="text-xs text-gray-500" data-i18n="professionalVirtualHost" data-default="專業級虛擬主播">專業級虛擬主播</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="floating-element absolute top-32 right-16" style="animation-delay: 1s;">
                <div class="bg-white rounded-xl p-4 shadow-xl border border-blue-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-xl flex items-center justify-center">
                            <i class="fas fa-microphone text-white text-lg"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-gray-800" data-i18n="voiceCloning" data-default="聲音克隆">聲音克隆</h4>
                            <p class="text-xs text-gray-500" data-i18n="generate60Seconds" data-default="60秒生成您的聲音">60秒生成您的聲音</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="floating-element absolute bottom-24 left-20" style="animation-delay: 1.5s;">
                <div class="bg-white rounded-xl p-4 shadow-xl border border-green-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl flex items-center justify-center">
                            <i class="fas fa-download text-white text-lg"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-gray-800" data-i18n="oneClickExport" data-default="一鍵導出">一鍵導出</h4>
                            <p class="text-xs text-gray-500" data-i18n="multiFormatHD" data-default="多格式高清輸出">多格式高清輸出</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="floating-element absolute bottom-32 right-24" style="animation-delay: 2s;">
                <div class="bg-white rounded-xl p-4 shadow-xl border border-yellow-100">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-gradient-to-r from-yellow-500 to-orange-500 rounded-xl flex items-center justify-center">
                            <i class="fas fa-robot text-white text-lg"></i>
                        </div>
                        <div>
                            <h4 class="text-sm font-bold text-gray-800" data-i18n="aiSmartSynthesis" data-default="AI 智能合成">AI 智能合成</h4>
                            <p class="text-xs text-gray-500" data-i18n="autoGenerateProfessional" data-default="自動生成專業影片">自動生成專業影片</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 裝飾性圓點 - 更多更美 -->
            <div class="absolute top-12 right-12 w-4 h-4 bg-gradient-to-r from-yellow-400 to-orange-400 rounded-full opacity-70 floating-element" style="animation-delay: 0.3s;"></div>
            <div class="absolute bottom-20 left-16 w-3 h-3 bg-gradient-to-r from-pink-400 to-red-400 rounded-full opacity-60 floating-element" style="animation-delay: 1.2s;"></div>
            <div class="absolute top-1/3 left-8 w-5 h-5 bg-gradient-to-r from-blue-400 to-purple-400 rounded-full opacity-50 floating-element" style="animation-delay: 2.1s;"></div>
            <div class="absolute top-20 left-1/3 w-2 h-2 bg-gradient-to-r from-green-400 to-teal-400 rounded-full opacity-80 floating-element" style="animation-delay: 0.8s;"></div>
            <div class="absolute bottom-16 right-8 w-6 h-6 bg-gradient-to-r from-indigo-400 to-blue-400 rounded-full opacity-40 floating-element" style="animation-delay: 1.7s;"></div>

            <!-- 底部文字 -->
            <div class="absolute bottom-8 left-8 right-8 text-center">
                <h3 class="text-2xl font-bold text-white mb-2" data-i18n="continueCreativeJourney" data-default="繼續您的創作之旅">繼續您的創作之旅</h3>
                <p class="text-white/80" data-i18n="accessAfterLogin" data-default="登入後立即訪問您的所有項目和創作工具">登入後立即訪問您的所有項目和創作工具</p>
            </div>
        </div>
    </div>

    <script>
        // 營銷影片URL - 將來替換為實際的Vidspark演示影片
        const MARKETING_VIDEO_URL = "https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0&modestbranding=1";
        
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.querySelector('.fa-eye');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function playMarketingVideo() {
            // 創建模態框播放影片
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-90 flex items-center justify-center z-50';
            modal.innerHTML = `
                <div class="relative w-full max-w-4xl mx-4">
                    <button 
                        onclick="this.parentElement.parentElement.remove()" 
                        class="absolute -top-12 right-0 text-white text-2xl hover:text-gray-300 transition-colors"
                    >
                        <i class="fas fa-times"></i>
                    </button>
                    <div class="relative pt-[56.25%]">
                        <iframe 
                            src="${MARKETING_VIDEO_URL}"
                            class="absolute inset-0 w-full h-full rounded-lg"
                            frameborder="0" 
                            allowfullscreen
                            allow="autoplay; encrypted-media"
                        ></iframe>
                    </div>
                    <div class="text-center mt-6">
                        <h3 class="text-white text-xl font-bold mb-2">Vidspark AI 影片創作平台演示</h3>
                        <p class="text-gray-300">體驗從文字到專業影片的神奇轉換過程</p>
                    </div>
                </div>
            `;
            
            document.body.appendChild(modal);
            
            // 點擊背景關閉模態框
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
            
            // ESC鍵關閉模態框
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    modal.remove();
                }
            });
        }

        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // 這裡可以添加登入邏輯
            console.log('登入嘗試:', { email, password });
            
            // 示例：直接跳轉到Vue應用
            window.location.href = '/vidspark-v2/#/dashboard';
            
            return false;
        }

        // 頁面載入時添加一些互動效果
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化多語言系統
            if (typeof I18nManager !== 'undefined') {
                const i18nManager = new I18nManager();
                i18nManager.init();
            }
            // 為浮動元素添加鼠標懸停效果
            const floatingElements = document.querySelectorAll('.floating-element');
            floatingElements.forEach(element => {
                element.addEventListener('mouseenter', function() {
                    this.style.transform = 'scale(1.1) translateY(-5px)';
                    this.style.zIndex = '20';
                });
                element.addEventListener('mouseleave', function() {
                    this.style.transform = '';
                    this.style.zIndex = '';
                });
            });
        });
    </script>
</body>
</html>

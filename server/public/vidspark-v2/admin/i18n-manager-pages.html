        // 保存到localStorage
        function saveTranslations() {
            localStorage.setItem('vidspark-i18n-pages-dictionary', JSON.stringify(translationsByPage));
            // 同時保存到舊格式，保持兼容性
            const flatTranslations = {};
            Object.values(translationsByPage).forEach(pageTranslations => {
                Object.assign(flatTranslations, pageTranslations);
            });
            localStorage.setItem('vidspark-i18n-dictionary', JSON.stringify(flatTranslations));
            console.log(`[${new Date().toLocaleTimeString()}] 💾 已保存到本地存儲`);
        }
        
        // 渲染頁面標籤
        function renderPageTabs() {
            const tabsContainer = document.getElementById('page-tabs');
            tabsContainer.innerHTML = '';
            
            Object.keys(pages).forEach(pageKey => {
                const page = pages[pageKey];
                const tab = document.createElement('button');
                tab.className = `page-tab px-6 py-3 rounded-lg font-medium text-sm border-2 border-purple-200 ${
                    currentPage === pageKey ? 'active' : 'bg-white text-purple-600 hover:bg-purple-50'
                }`;
                tab.innerHTML = `<i class="${page.icon} mr-2"></i>${page.name}`;
                tab.addEventListener('click', () => switchPage(pageKey));
                tabsContainer.appendChild(tab);
            });
        }
        
        // 切換頁面
        function switchPage(pageKey) {
            currentPage = pageKey;
            document.getElementById('current-page-name').textContent = pages[pageKey].name;
            renderPageTabs();
            renderTranslationsTable();
        }
        
        // 渲染翻譯表格
        function renderTranslationsTable() {
            const tbody = document.getElementById('translations-table');
            tbody.innerHTML = '';
            
            const translationsToShow = currentPage === 'all' 
                ? getAllTranslations() 
                : translationsByPage[currentPage] || {};
            
            Object.keys(translationsToShow).forEach(key => {
                const translation = translationsToShow[key];
                const pageName = currentPage === 'all' ? getPageForKey(key) : currentPage;
                
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                        <code class="bg-gray-100 px-2 py-1 rounded">${key}</code>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        <span class="translation-text" data-key="${key}" data-lang="zh-TW">${translation['zh-TW'] || ''}</span>
                        ${!translation['zh-TW'] ? '<span class="text-red-500 text-xs ml-2">未翻譯</span>' : ''}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                        <span class="translation-text" data-key="${key}" data-lang="zh-CN">${translation['zh-CN'] || ''}</span>
                        ${!translation['zh-CN'] ? '<span class="text-red-500 text-xs ml-2">未翻譯</span>' : ''}
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-purple-100 text-purple-800">
                            <i class="${pages[pageName]?.icon || 'fas fa-file'} mr-1"></i>
                            ${pages[pageName]?.name || pageName}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                        <button class="text-purple-600 hover:text-purple-900 mr-3 edit-btn" data-key="${key}" data-page="${pageName}">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="text-red-600 hover:text-red-900 delete-btn" data-key="${key}" data-page="${pageName}">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });
            
            // 綁定編輯和刪除事件
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const key = e.target.closest('button').dataset.key;
                    const page = e.target.closest('button').dataset.page;
                    editTranslation(key, page);
                });
            });
            
            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const key = e.target.closest('button').dataset.key;
                    const page = e.target.closest('button').dataset.page;
                    if (confirm(`確定要刪除字段 "${key}" 嗎？`)) {
                        if (translationsByPage[page] && translationsByPage[page][key]) {
                            delete translationsByPage[page][key];
                            saveTranslations();
                            renderTranslationsTable();
                            updateStatistics();
                        }
                    }
                });
            });
        }
        
        // 獲取所有翻譯
        function getAllTranslations() {
            const allTranslations = {};
            Object.values(translationsByPage).forEach(pageTranslations => {
                Object.assign(allTranslations, pageTranslations);
            });
            return allTranslations;
        }
        
        // 獲取字段所屬頁面
        function getPageForKey(key) {
            for (const [pageName, translations] of Object.entries(translationsByPage)) {
                if (translations[key]) {
                    return pageName;
                }
            }
            return 'common';
        }
        
        // 更新統計信息
        function updateStatistics() {
            const allTranslations = getAllTranslations();
            const totalKeys = Object.keys(allTranslations).length;
            document.getElementById('total-keys').textContent = totalKeys;
            
            // 計算各語言完成度
            let zhTwCount = 0, zhCnCount = 0;
            
            Object.values(allTranslations).forEach(translation => {
                if (translation['zh-TW']) zhTwCount++;
                if (translation['zh-CN']) zhCnCount++;
            });
            
            // 更新繁體中文統計
            const zhTwPercentage = totalKeys > 0 ? Math.round((zhTwCount / totalKeys) * 100) : 0;
            document.getElementById('zh-tw-percentage').textContent = zhTwPercentage + '%';
            document.getElementById('zh-tw-progress').style.width = zhTwPercentage + '%';
            document.getElementById('zh-tw-count').textContent = zhTwCount;
            document.getElementById('zh-tw-total').textContent = totalKeys;
            
            // 更新簡體中文統計
            const zhCnPercentage = totalKeys > 0 ? Math.round((zhCnCount / totalKeys) * 100) : 0;
            document.getElementById('zh-cn-percentage').textContent = zhCnPercentage + '%';
            document.getElementById('zh-cn-progress').style.width = zhCnPercentage + '%';
            document.getElementById('zh-cn-count').textContent = zhCnCount;
            document.getElementById('zh-cn-total').textContent = totalKeys;
            
            // 更新英文統計
            document.getElementById('en-count').textContent = totalKeys;
        }
        
        // 編輯翻譯
        function editTranslation(key, page) {
            const translation = translationsByPage[page]?.[key] || {};
            document.getElementById('modal-title').textContent = '編輯翻譯';
            document.getElementById('field-key').value = key;
            document.getElementById('field-key').disabled = true;
            document.getElementById('field-zh-tw').value = translation['zh-TW'] || '';
            document.getElementById('field-zh-cn').value = translation['zh-CN'] || '';
            document.getElementById('field-page').value = page;
            
            document.getElementById('translation-modal').classList.remove('hidden');
        }
        
        // 新增翻譯
        function addTranslation() {
            document.getElementById('modal-title').textContent = '新增翻譯';
            document.getElementById('field-key').value = '';
            document.getElementById('field-key').disabled = false;
            document.getElementById('field-zh-tw').value = '';
            document.getElementById('field-zh-cn').value = '';
            document.getElementById('field-page').value = currentPage === 'all' ? 'landing' : currentPage;
            
            document.getElementById('translation-modal').classList.remove('hidden');
        }
        
        // 導出Excel格式
        function exportToExcel() {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "頁面,英文字段,繁體中文,簡體中文\n";
            
            Object.entries(translationsByPage).forEach(([pageName, translations]) => {
                Object.keys(translations).forEach(key => {
                    const translation = translations[key];
                    csvContent += `"${pages[pageName]?.name || pageName}","${key}","${translation['zh-TW'] || ''}","${translation['zh-CN'] || ''}"\n`;
                });
            });
            
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "vidspark-i18n-pages-dictionary.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            console.log(`[${new Date().toLocaleTimeString()}] 📥 已導出頁面分類Excel文件`);
        }
        
        // 初始化事件監聽器
        document.addEventListener('DOMContentLoaded', function() {
            loadTranslations();
            
            // 新增按鈕
            document.getElementById('add-translation-btn').addEventListener('click', addTranslation);
            
            // 導出Excel按鈕
            document.getElementById('export-excel-btn').addEventListener('click', exportToExcel);
            
            // 重置數據按鈕
            document.getElementById('reset-data-btn').addEventListener('click', () => {
                if (confirm('確定要重置所有翻譯數據嗎？這將清除所有自定義翻譯並恢復到默認狀態。')) {
                    localStorage.removeItem('vidspark-i18n-pages-dictionary');
                    localStorage.removeItem('vidspark-i18n-dictionary');
                    location.reload();
                }
            });
            
            // 關閉對話框
            document.getElementById('close-modal').addEventListener('click', () => {
                document.getElementById('translation-modal').classList.add('hidden');
            });
            
            document.getElementById('cancel-btn').addEventListener('click', () => {
                document.getElementById('translation-modal').classList.add('hidden');
            });
            
            // 表單提交
            document.getElementById('translation-form').addEventListener('submit', (e) => {
                e.preventDefault();
                
                const key = document.getElementById('field-key').value.trim();
                const zhTW = document.getElementById('field-zh-tw').value.trim();
                const zhCN = document.getElementById('field-zh-cn').value.trim();
                const page = document.getElementById('field-page').value;
                
                if (!key) {
                    alert('請輸入英文字段！');
                    return;
                }
                
                if (!page) {
                    alert('請選擇所屬頁面！');
                    return;
                }
                
                // 驗證字段格式
                if (!/^[a-z][a-zA-Z0-9_]*$/.test(key)) {
                    alert('字段格式錯誤！請使用駝峰命名法 (例如: welcomeMessage)');
                    return;
                }
                
                // 初始化頁面如果不存在
                if (!translationsByPage[page]) {
                    translationsByPage[page] = {};
                }
                
                translationsByPage[page][key] = {
                    'en': key, // 英文字段作為英文翻譯
                    'zh-TW': zhTW,
                    'zh-CN': zhCN
                };
                
                saveTranslations();
                renderTranslationsTable();
                updateStatistics();
                
                document.getElementById('translation-modal').classList.add('hidden');
                console.log(`[${new Date().toLocaleTimeString()}] ✅ 已保存翻譯: ${key} (${page})`);
            });
            
            // 搜索功能
            document.getElementById('search-input').addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const rows = document.querySelectorAll('#translations-table tr');
                
                rows.forEach(row => {
                    const text = row.textContent.toLowerCase();
                    if (text.includes(searchTerm)) {
                        row.style.display = '';
                    } else {
                        row.style.display = 'none';
                    }
                });
            });
            
            // 刷新按鈕
            document.getElementById('refresh-btn').addEventListener('click', () => {
                renderTranslationsTable();
                updateStatistics();
                console.log(`[${new Date().toLocaleTimeString()}] 🔄 已刷新數據`);
            });
        });
    </script>
</body>
</html>

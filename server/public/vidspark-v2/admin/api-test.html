<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API測試頁面</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6">Vidspark API 連接測試</h1>
        
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-lg font-semibold mb-4">API 端點測試</h2>
            
            <div class="space-y-4">
                <button onclick="testDictionary()" class="bg-blue-500 text-white px-4 py-2 rounded mr-2">
                    測試字典API
                </button>
                <button onclick="testStatistics()" class="bg-green-500 text-white px-4 py-2 rounded mr-2">
                    測試統計API
                </button>
                <button onclick="testLanguages()" class="bg-purple-500 text-white px-4 py-2 rounded">
                    測試語言API
                </button>
            </div>
            
            <div id="results" class="mt-6 p-4 bg-gray-50 rounded min-h-[200px]">
                <p class="text-gray-600">點擊按鈕測試API連接...</p>
            </div>
        </div>
    </div>

    <script>
        function logResult(title, result) {
            const resultsDiv = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            resultsDiv.innerHTML += `
                <div class="mb-2">
                    <span class="font-semibold">[${timestamp}] ${title}:</span>
                    <pre class="mt-1 text-sm bg-white p-2 rounded">${JSON.stringify(result, null, 2)}</pre>
                </div>
            `;
        }

        async function testDictionary() {
            try {
                console.log('🧪 測試字典API...');
                const response = await fetch('/vidspark-v2/api/i18n/dictionary');
                console.log('Response status:', response.status);
                console.log('Response headers:', [...response.headers.entries()]);
                
                const text = await response.text();
                console.log('Response text:', text.substring(0, 200));
                
                let result;
                try {
                    result = JSON.parse(text);
                    logResult('✅ 字典API成功', result);
                } catch (e) {
                    logResult('❌ 字典API返回非JSON', { status: response.status, text: text.substring(0, 300) });
                }
            } catch (error) {
                console.error('API請求失敗:', error);
                logResult('❌ 字典API請求失敗', { error: error.message });
            }
        }

        async function testStatistics() {
            try {
                console.log('🧪 測試統計API...');
                const response = await fetch('/vidspark-v2/api/i18n/statistics');
                const text = await response.text();
                
                let result;
                try {
                    result = JSON.parse(text);
                    logResult('✅ 統計API成功', result);
                } catch (e) {
                    logResult('❌ 統計API返回非JSON', { status: response.status, text: text.substring(0, 300) });
                }
            } catch (error) {
                logResult('❌ 統計API請求失敗', { error: error.message });
            }
        }

        async function testLanguages() {
            try {
                console.log('🧪 測試語言API...');
                const response = await fetch('/vidspark-v2/api/i18n/languages');
                const text = await response.text();
                
                let result;
                try {
                    result = JSON.parse(text);
                    logResult('✅ 語言API成功', result);
                } catch (e) {
                    logResult('❌ 語言API返回非JSON', { status: response.status, text: text.substring(0, 300) });
                }
            } catch (error) {
                logResult('❌ 語言API請求失敗', { error: error.message });
            }
        }

        // 自動測試
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 API測試頁面已載入');
            setTimeout(() => {
                testDictionary();
            }, 1000);
        });
    </script>
</body>
</html>

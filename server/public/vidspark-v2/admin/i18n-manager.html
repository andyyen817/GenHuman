<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidspark 多語言管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .table-container {
            max-height: 600px;
            overflow-y: auto;
        }
        .sticky-header th {
            position: sticky;
            top: 0;
            background: white;
            z-index: 10;
        }
        .loading {
            display: none;
        }
        .loading.show {
            display: block;
        }
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            max-width: 400px;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- 通知區域 -->
    <div id="notification-container" class="notification"></div>

    <!-- 頁面標題 -->
    <div class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center py-6">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900">
                        <i class="fas fa-language text-purple-600 mr-3"></i>
                        Vidspark 多語言管理系統
                    </h1>
                    <p class="mt-2 text-gray-600">管理所有頁面的多語言翻譯內容</p>
                </div>
                <div class="flex items-center space-x-4">
                    <!-- 統計信息 -->
                    <div id="statistics" class="bg-purple-50 rounded-lg px-4 py-2">
                        <div class="text-sm text-purple-700">
                            <span class="font-semibold">總字段數：</span>
                            <span id="total-keys">0</span>
                        </div>
                    </div>
                    <!-- 新增按鈕 -->
                    <button id="add-translation-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">
                        <i class="fas fa-plus mr-2"></i>新增翻譯
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- 主要內容 -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- 語言進度統計 -->
        <div id="language-progress" class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <!-- 動態生成語言進度卡片 -->
        </div>

        <!-- 翻譯字典表格 -->
        <div class="bg-white rounded-lg shadow overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-gray-900">
                        <i class="fas fa-table mr-2"></i>翻譯字典管理
                    </h2>
                    <div class="flex items-center space-x-4">
                        <!-- 搜索框 -->
                        <div class="relative">
                            <input type="text" id="search-input" placeholder="搜索字段..." 
                                   class="pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        </div>
                        <!-- 刷新按鈕 -->
                        <button id="refresh-btn" class="text-gray-500 hover:text-gray-700 p-2">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 表格容器 -->
            <div class="table-container">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50 sticky-header">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                字段Key
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                English
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                繁體中文
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                简体中文
                            </th>
                            <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                                操作
                            </th>
                        </tr>
                    </thead>
                    <tbody id="translations-tbody" class="bg-white divide-y divide-gray-200">
                        <!-- 動態生成翻譯行 -->
                    </tbody>
                </table>
            </div>

            <!-- 載入中狀態 -->
            <div id="loading" class="loading text-center py-12">
                <div class="inline-flex items-center">
                    <i class="fas fa-spinner fa-spin text-purple-600 text-xl mr-3"></i>
                    <span class="text-gray-600">載入中...</span>
                </div>
            </div>

            <!-- 空狀態 -->
            <div id="empty-state" class="hidden text-center py-12">
                <i class="fas fa-language text-gray-300 text-6xl mb-4"></i>
                <h3 class="text-lg font-medium text-gray-900 mb-2">尚無翻譯內容</h3>
                <p class="text-gray-500 mb-6">開始建立您的第一個多語言翻譯</p>
                <button class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-2 rounded-lg font-medium transition-colors" 
                        onclick="openAddModal()">
                    <i class="fas fa-plus mr-2"></i>新增翻譯
                </button>
            </div>
        </div>
    </div>

    <!-- 新增/編輯翻譯模態框 -->
    <div id="translation-modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-40">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl max-w-2xl w-full">
                <!-- 模態框標題 -->
                <div class="px-6 py-4 border-b border-gray-200">
                    <h3 id="modal-title" class="text-lg font-semibold text-gray-900">新增翻譯</h3>
                </div>

                <!-- 模態框內容 -->
                <div class="px-6 py-4">
                    <form id="translation-form">
                        <!-- 字段Key -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                字段Key <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="field-key" 
                                   placeholder="例如：email_label, login_button (駝峰命名法)"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                   pattern="^[a-z][a-zA-Z0-9_]*$"
                                   required>
                            <p class="mt-1 text-xs text-gray-500">
                                使用駝峰命名法，以小寫字母開頭，可包含數字和底線
                            </p>
                        </div>

                        <!-- 英文翻譯 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                English <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="translation-en" 
                                   placeholder="English translation"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                   required>
                        </div>

                        <!-- 繁體中文翻譯 -->
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                繁體中文 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="translation-zh-tw" 
                                   placeholder="繁體中文翻譯"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                   required>
                        </div>

                        <!-- 简体中文翻譯 -->
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                简体中文 <span class="text-red-500">*</span>
                            </label>
                            <input type="text" id="translation-zh-cn" 
                                   placeholder="简体中文翻译"
                                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-purple-500 focus:border-transparent"
                                   required>
                        </div>
                    </form>
                </div>

                <!-- 模態框按鈕 -->
                <div class="px-6 py-4 border-t border-gray-200 flex justify-end space-x-3">
                    <button id="cancel-btn" class="px-4 py-2 text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium transition-colors">
                        取消
                    </button>
                    <button id="save-btn" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg font-medium transition-colors">
                        <i class="fas fa-save mr-2"></i>保存
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 全局變量
        let translations = {};
        let isEditMode = false;
        let editingKey = '';

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log(`[${new Date().toLocaleTimeString()}] 🚀 初始化多語言管理系統`);
            loadTranslations();
            loadStatistics();
            setupEventListeners();
        });

        // 設置事件監聽器
        function setupEventListeners() {
            // 新增翻譯按鈕
            document.getElementById('add-translation-btn').addEventListener('click', openAddModal);
            
            // 模態框控制
            document.getElementById('cancel-btn').addEventListener('click', closeModal);
            document.getElementById('save-btn').addEventListener('click', saveTranslation);
            
            // 搜索功能
            document.getElementById('search-input').addEventListener('input', filterTranslations);
            
            // 刷新按鈕
            document.getElementById('refresh-btn').addEventListener('click', function() {
                console.log(`[${new Date().toLocaleTimeString()}] 🔄 手動刷新數據`);
                loadTranslations();
                loadStatistics();
            });

            // 點擊模態框外部關閉
            document.getElementById('translation-modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
        }

        // 載入翻譯數據
        async function loadTranslations() {
            console.log(`[${new Date().toLocaleTimeString()}] 📡 開始載入翻譯數據`);
            
            try {
                showLoading(true);
                
                const response = await fetch('/vidspark-v2/api/i18n/dictionary');
                const result = await response.json();
                
                if (result.success) {
                    translations = result.data;
                    console.log(`[${new Date().toLocaleTimeString()}] ✅ 載入成功: ${Object.keys(translations).length} 個字段`);
                    renderTranslationsTable();
                } else {
                    throw new Error('Failed to load translations');
                }
            } catch (error) {
                console.error(`[${new Date().toLocaleTimeString()}] ❌ 載入失敗:`, error);
                showNotification('載入翻譯數據失敗', 'error');
            } finally {
                showLoading(false);
            }
        }

        // 載入統計信息
        async function loadStatistics() {
            try {
                const response = await fetch('/vidspark-v2/api/i18n/statistics');
                const result = await response.json();
                
                if (result.success) {
                    renderStatistics(result.data);
                }
            } catch (error) {
                console.error('載入統計信息失敗:', error);
            }
        }

        // 渲染統計信息
        function renderStatistics(stats) {
            // 更新總字段數
            document.getElementById('total-keys').textContent = stats.total_keys;
            
            // 渲染語言進度
            const progressContainer = document.getElementById('language-progress');
            progressContainer.innerHTML = '';
            
            Object.entries(stats.languages).forEach(([code, info]) => {
                const progressCard = createProgressCard(code, info);
                progressContainer.appendChild(progressCard);
            });
        }

        // 創建進度卡片
        function createProgressCard(languageCode, info) {
            const card = document.createElement('div');
            card.className = 'bg-white rounded-lg shadow p-6';
            
            const progressColor = info.percentage >= 90 ? 'green' : 
                                 info.percentage >= 70 ? 'yellow' : 'red';
            
            card.innerHTML = `
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-lg font-semibold text-gray-900">${info.name}</h3>
                    <span class="text-2xl font-bold text-${progressColor}-600">${info.percentage}%</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2 mb-2">
                    <div class="bg-${progressColor}-600 h-2 rounded-full transition-all duration-300" 
                         style="width: ${info.percentage}%"></div>
                </div>
                <p class="text-sm text-gray-600">
                    ${info.translated} / ${info.translated + (100 - info.percentage) * info.translated / info.percentage || 0} 已翻譯
                </p>
            `;
            
            return card;
        }

        // 渲染翻譯表格
        function renderTranslationsTable() {
            const tbody = document.getElementById('translations-tbody');
            const emptyState = document.getElementById('empty-state');
            
            if (Object.keys(translations).length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            
            emptyState.classList.add('hidden');
            tbody.innerHTML = '';
            
            Object.entries(translations).forEach(([key, translation]) => {
                const row = createTranslationRow(key, translation);
                tbody.appendChild(row);
            });
        }

        // 創建翻譯行
        function createTranslationRow(key, translation) {
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50';
            
            row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap">
                    <div class="text-sm font-medium text-gray-900">${key}</div>
                </td>
                <td class="px-6 py-4">
                    <div class="text-sm text-gray-900">${translation.en || '-'}</div>
                </td>
                <td class="px-6 py-4">
                    <div class="text-sm text-gray-900">${translation['zh-TW'] || '-'}</div>
                </td>
                <td class="px-6 py-4">
                    <div class="text-sm text-gray-900">${translation['zh-CN'] || '-'}</div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-center">
                    <div class="flex justify-center space-x-2">
                        <button onclick="editTranslation('${key}')" 
                                class="text-purple-600 hover:text-purple-900 p-1" title="編輯">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button onclick="deleteTranslation('${key}')" 
                                class="text-red-600 hover:text-red-900 p-1" title="刪除">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </td>
            `;
            
            return row;
        }

        // 搜索過濾
        function filterTranslations() {
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            const rows = document.querySelectorAll('#translations-tbody tr');
            
            rows.forEach(row => {
                const key = row.querySelector('td:first-child .text-sm').textContent.toLowerCase();
                const en = row.querySelector('td:nth-child(2) .text-sm').textContent.toLowerCase();
                const zhTW = row.querySelector('td:nth-child(3) .text-sm').textContent.toLowerCase();
                const zhCN = row.querySelector('td:nth-child(4) .text-sm').textContent.toLowerCase();
                
                const matches = key.includes(searchTerm) || 
                               en.includes(searchTerm) || 
                               zhTW.includes(searchTerm) || 
                               zhCN.includes(searchTerm);
                
                row.style.display = matches ? '' : 'none';
            });
        }

        // 開啟新增模態框
        function openAddModal() {
            isEditMode = false;
            editingKey = '';
            
            document.getElementById('modal-title').textContent = '新增翻譯';
            document.getElementById('field-key').disabled = false;
            clearForm();
            
            document.getElementById('translation-modal').classList.remove('hidden');
        }

        // 編輯翻譯
        function editTranslation(key) {
            isEditMode = true;
            editingKey = key;
            
            document.getElementById('modal-title').textContent = '編輯翻譯';
            document.getElementById('field-key').disabled = true;
            
            // 填充表單
            const translation = translations[key];
            document.getElementById('field-key').value = key;
            document.getElementById('translation-en').value = translation.en || '';
            document.getElementById('translation-zh-tw').value = translation['zh-TW'] || '';
            document.getElementById('translation-zh-cn').value = translation['zh-CN'] || '';
            
            document.getElementById('translation-modal').classList.remove('hidden');
        }

        // 刪除翻譯
        async function deleteTranslation(key) {
            if (!confirm(`確定要刪除 "${key}" 嗎？`)) {
                return;
            }
            
            try {
                console.log(`[${new Date().toLocaleTimeString()}] 🗑️ 刪除翻譯: ${key}`);
                
                const response = await fetch(`/vidspark-v2/api/i18n/translation/${encodeURIComponent(key)}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification('翻譯刪除成功', 'success');
                    loadTranslations();
                    loadStatistics();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(`[${new Date().toLocaleTimeString()}] ❌ 刪除失敗:`, error);
                showNotification('刪除翻譯失敗', 'error');
            }
        }

        // 保存翻譯
        async function saveTranslation() {
            const key = document.getElementById('field-key').value.trim();
            const en = document.getElementById('translation-en').value.trim();
            const zhTW = document.getElementById('translation-zh-tw').value.trim();
            const zhCN = document.getElementById('translation-zh-cn').value.trim();
            
            // 驗證字段
            if (!key || !en || !zhTW || !zhCN) {
                showNotification('請填寫所有必填字段', 'error');
                return;
            }
            
            // 驗證key格式
            if (!/^[a-z][a-zA-Z0-9_]*$/.test(key)) {
                showNotification('字段Key格式不正確，請使用駝峰命名法', 'error');
                return;
            }
            
            // 檢查重複key（新增模式）
            if (!isEditMode && translations[key]) {
                showNotification('該字段Key已存在', 'error');
                return;
            }
            
            try {
                console.log(`[${new Date().toLocaleTimeString()}] 💾 保存翻譯: ${key}`);
                
                const response = await fetch('/vidspark-v2/api/i18n/translation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        key: key,
                        translations: {
                            en: en,
                            'zh-TW': zhTW,
                            'zh-CN': zhCN
                        }
                    })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showNotification(isEditMode ? '翻譯更新成功' : '翻譯新增成功', 'success');
                    closeModal();
                    loadTranslations();
                    loadStatistics();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(`[${new Date().toLocaleTimeString()}] ❌ 保存失敗:`, error);
                showNotification('保存翻譯失敗', 'error');
            }
        }

        // 關閉模態框
        function closeModal() {
            document.getElementById('translation-modal').classList.add('hidden');
            clearForm();
        }

        // 清空表單
        function clearForm() {
            document.getElementById('field-key').value = '';
            document.getElementById('translation-en').value = '';
            document.getElementById('translation-zh-tw').value = '';
            document.getElementById('translation-zh-cn').value = '';
        }

        // 顯示載入狀態
        function showLoading(show) {
            const loading = document.getElementById('loading');
            if (show) {
                loading.classList.add('show');
            } else {
                loading.classList.remove('show');
            }
        }

        // 顯示通知
        function showNotification(message, type = 'info') {
            const container = document.getElementById('notification-container');
            
            const notification = document.createElement('div');
            notification.className = `mb-4 p-4 rounded-lg shadow-lg transition-all duration-300 transform translate-x-full`;
            
            const colors = {
                success: 'bg-green-100 border border-green-400 text-green-700',
                error: 'bg-red-100 border border-red-400 text-red-700',
                info: 'bg-blue-100 border border-blue-400 text-blue-700'
            };
            
            const icons = {
                success: 'fas fa-check-circle',
                error: 'fas fa-exclamation-circle',
                info: 'fas fa-info-circle'
            };
            
            notification.className += ` ${colors[type]}`;
            notification.innerHTML = `
                <div class="flex items-center">
                    <i class="${icons[type]} mr-2"></i>
                    <span>${message}</span>
                    <button onclick="this.parentElement.parentElement.remove()" 
                            class="ml-auto text-gray-500 hover:text-gray-700">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
            `;
            
            container.appendChild(notification);
            
            // 動畫進入
            setTimeout(() => {
                notification.classList.remove('translate-x-full');
            }, 100);
            
            // 自動移除
            setTimeout(() => {
                if (notification.parentElement) {
                    notification.classList.add('translate-x-full');
                    setTimeout(() => {
                        if (notification.parentElement) {
                            notification.remove();
                        }
                    }, 300);
                }
            }, 5000);
        }
    </script>
</body>
</html>

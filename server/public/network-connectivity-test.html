<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網絡連接測試工具</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; }
        .test-item { margin: 15px 0; padding: 15px; border-left: 4px solid #007bff; background: #f8f9fa; }
        .test-item.success { border-left-color: #28a745; background: #d4edda; }
        .test-item.error { border-left-color: #dc3545; background: #f8d7da; }
        .test-item.warning { border-left-color: #ffc107; background: #fff3cd; }
        .test-item.testing { border-left-color: #17a2b8; background: #d1ecf1; }
        .btn { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; margin: 10px 5px 0 0; }
        .btn:hover { background: #0056b3; }
        .btn.test { background: #28a745; }
        .btn.ping { background: #ffc107; color: #333; }
        h1 { color: #333; text-align: center; }
        h2 { color: #555; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
        .status { font-weight: bold; }
        .code { background: #f1f1f1; padding: 2px 6px; border-radius: 3px; font-family: monospace; }
        .details { margin-top: 10px; font-size: 0.9em; }
        .loading { color: #666; font-style: italic; }
        .official-suggestion { background: #e7f3ff; padding: 15px; border-radius: 5px; margin: 20px 0; border-left: 4px solid #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Zeabur網絡連接測試工具</h1>
        <p><strong>目的</strong>：根據官方建議檢查服務器網絡是否可以訪問GenHuman API</p>
        
        <div class="official-suggestion">
            <h3>📋 官方建議</h3>
            <p><strong>問題</strong>：504 Gateway Time-out</p>
            <p><strong>官方回應</strong>：確認下你們服務器網絡可以訪問接口地址，ping下看看</p>
        </div>

        <button class="btn test" onclick="runAllTests()">🚀 開始網絡測試</button>
        <button class="btn ping" onclick="testPing()">🏓 Ping測試</button>
        <button class="btn" onclick="testApiConnectivity()">🔗 API連接測試</button>
        <button class="btn" onclick="location.reload()">🔄 刷新頁面</button>

        <div id="results"></div>
        
        <h2>📊 測試結果說明</h2>
        <div class="test-item">
            <strong>測試項目</strong>：
            <ul>
                <li><strong>基本Ping測試</strong>：檢查是否能連接到GenHuman API域名</li>
                <li><strong>HTTP連接測試</strong>：檢查HTTP/HTTPS訪問是否正常</li>
                <li><strong>API端點測試</strong>：測試具體的API接口是否可訪問</li>
                <li><strong>網絡延遲測試</strong>：測量網絡響應時間</li>
                <li><strong>DNS解析測試</strong>：檢查域名解析是否正常</li>
            </ul>
        </div>
    </div>

    <script>
        let testResults = [];

        async function runAllTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>🔄 正在進行網絡連接測試...</h2>';
            testResults = [];

            await testDnsResolution();
            await testPing();
            await testHttpConnectivity();
            await testApiConnectivity();
            await testNetworkLatency();

            displaySummary();
        }

        async function testDnsResolution() {
            addTestResult('DNS解析測試', 'testing', '正在檢查域名解析...');
            
            try {
                // 嘗試解析域名
                const startTime = Date.now();
                const response = await fetch('https://api.yidevs.com', {
                    method: 'HEAD',
                    mode: 'no-cors'  // 避免CORS問題
                });
                const endTime = Date.now();
                
                addTestResult('DNS解析測試', 'success', 
                    `✅ DNS解析成功 (${endTime - startTime}ms)`);
                    
            } catch (error) {
                addTestResult('DNS解析測試', 'error', 
                    `❌ DNS解析失敗: ${error.message}`);
            }
        }

        async function testPing() {
            addTestResult('Ping測試', 'testing', '正在進行網絡連接測試...');
            
            try {
                const startTime = Date.now();
                
                // 模擬ping測試（使用HEAD請求）
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 10000);
                
                const response = await fetch('https://api.yidevs.com', {
                    method: 'HEAD',
                    signal: controller.signal,
                    mode: 'no-cors'
                });
                
                clearTimeout(timeoutId);
                const endTime = Date.now();
                const responseTime = endTime - startTime;
                
                let status = 'success';
                let message = `✅ 網絡連接正常 (${responseTime}ms)`;
                
                if (responseTime > 5000) {
                    status = 'warning';
                    message = `⚠️ 網絡連接較慢 (${responseTime}ms) - 可能影響API性能`;
                } else if (responseTime > 2000) {
                    status = 'warning';  
                    message = `⚠️ 網絡延遲較高 (${responseTime}ms)`;
                }
                
                addTestResult('Ping測試', status, message);
                
            } catch (error) {
                let errorMsg = `❌ 網絡連接失敗: ${error.message}`;
                if (error.name === 'AbortError') {
                    errorMsg = '❌ 網絡連接超時 (>10秒) - 嚴重網絡問題';
                }
                addTestResult('Ping測試', 'error', errorMsg);
            }
        }

        async function testHttpConnectivity() {
            addTestResult('HTTP連接測試', 'testing', '正在測試HTTP/HTTPS訪問...');
            
            try {
                const tests = [
                    { name: 'HTTP訪問', url: 'http://api.yidevs.com' },
                    { name: 'HTTPS訪問', url: 'https://api.yidevs.com' }
                ];
                
                for (const test of tests) {
                    try {
                        const startTime = Date.now();
                        const response = await fetch(test.url, {
                            method: 'HEAD',
                            mode: 'no-cors'
                        });
                        const endTime = Date.now();
                        
                        addTestResult(`${test.name}`, 'success', 
                            `✅ ${test.name}成功 (${endTime - startTime}ms)`);
                            
                    } catch (error) {
                        addTestResult(`${test.name}`, 'error', 
                            `❌ ${test.name}失敗: ${error.message}`);
                    }
                }
                
            } catch (error) {
                addTestResult('HTTP連接測試', 'error', 
                    `❌ HTTP測試失敗: ${error.message}`);
            }
        }

        async function testApiConnectivity() {
            addTestResult('API連接測試', 'testing', '正在測試GenHuman API連接...');
            
            try {
                // 測試我們的API代理
                const response = await fetch('/vidspark-api-proxy/test-connection', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: 'test_token_for_connectivity'
                    })
                });
                
                const data = await response.json();
                
                if (data.success && data.test_results) {
                    const basicTest = data.test_results.basic_connection;
                    const networkTest = data.test_results.network_latency;
                    
                    if (basicTest.status === 'success') {
                        addTestResult('GenHuman API連接', 'success', 
                            `✅ API連接成功 (${basicTest.response_time})`);
                    } else {
                        addTestResult('GenHuman API連接', 'error', 
                            `❌ API連接失敗: ${basicTest.error}`);
                    }
                    
                    if (networkTest.status === 'success') {
                        addTestResult('API網絡延遲', 'success', 
                            `✅ 網絡延遲正常 (連接: ${networkTest.connect_time}, 總計: ${networkTest.total_time})`);
                    } else {
                        addTestResult('API網絡延遲', 'error', 
                            `❌ 網絡延遲測試失敗: ${networkTest.error || 'Unknown'}`);
                    }
                } else {
                    addTestResult('API連接測試', 'error', 
                        `❌ API代理測試失敗: ${data.message || 'Unknown error'}`);
                }
                
            } catch (error) {
                addTestResult('API連接測試', 'error', 
                    `❌ API測試請求失敗: ${error.message}`);
            }
        }

        async function testNetworkLatency() {
            addTestResult('網絡延遲測試', 'testing', '正在測試網絡性能...');
            
            try {
                const tests = [];
                const testCount = 3;
                
                for (let i = 0; i < testCount; i++) {
                    const startTime = Date.now();
                    await fetch('https://api.yidevs.com', {
                        method: 'HEAD',
                        mode: 'no-cors'
                    });
                    const endTime = Date.now();
                    tests.push(endTime - startTime);
                    
                    // 避免過於頻繁的請求
                    if (i < testCount - 1) {
                        await new Promise(resolve => setTimeout(resolve, 500));
                    }
                }
                
                const avgLatency = Math.round(tests.reduce((a, b) => a + b, 0) / tests.length);
                const minLatency = Math.min(...tests);
                const maxLatency = Math.max(...tests);
                
                let status = 'success';
                let message = `✅ 網絡性能良好 (平均: ${avgLatency}ms, 範圍: ${minLatency}-${maxLatency}ms)`;
                
                if (avgLatency > 3000) {
                    status = 'error';
                    message = `❌ 網絡性能差 (平均: ${avgLatency}ms) - 嚴重影響API調用`;
                } else if (avgLatency > 1500) {
                    status = 'warning';
                    message = `⚠️ 網絡性能一般 (平均: ${avgLatency}ms) - 可能影響API響應`;
                }
                
                addTestResult('網絡延遲測試', status, message);
                
            } catch (error) {
                addTestResult('網絡延遲測試', 'error', 
                    `❌ 延遲測試失敗: ${error.message}`);
            }
        }

        function addTestResult(testName, status, message) {
            testResults.push({ testName, status, message, timestamp: new Date() });
            updateDisplay();
        }

        function updateDisplay() {
            const resultsDiv = document.getElementById('results');
            let html = '<h2>📊 測試結果</h2>';
            
            testResults.forEach(result => {
                html += `
                    <div class="test-item ${result.status}">
                        <strong>${result.testName}</strong><br>
                        ${result.message}
                        <div class="details">時間: ${result.timestamp.toLocaleTimeString()}</div>
                    </div>
                `;
            });
            
            resultsDiv.innerHTML = html;
        }

        function displaySummary() {
            const passed = testResults.filter(r => r.status === 'success').length;
            const failed = testResults.filter(r => r.status === 'error').length;
            const warnings = testResults.filter(r => r.status === 'warning').length;
            
            let summaryHtml = `
                <div class="test-item ${failed > 0 ? 'error' : warnings > 0 ? 'warning' : 'success'}">
                    <h3>📋 測試總結</h3>
                    <p><strong>通過:</strong> ${passed} | <strong>警告:</strong> ${warnings} | <strong>失敗:</strong> ${failed}</p>
            `;
            
            if (failed > 0) {
                summaryHtml += '<p><strong>建議:</strong> 存在網絡連接問題，請聯繫Zeabur技術支持或檢查服務器網絡設置</p>';
            } else if (warnings > 0) {
                summaryHtml += '<p><strong>建議:</strong> 網絡性能一般，建議優化網絡配置或使用CDN加速</p>';
            } else {
                summaryHtml += '<p><strong>建議:</strong> 網絡連接正常，504錯誤可能由其他原因造成</p>';
            }
            
            summaryHtml += '</div>';
            
            document.getElementById('results').innerHTML += summaryHtml;
        }

        // 頁面載入時顯示說明
        window.onload = function() {
            document.getElementById('results').innerHTML = `
                <div class="test-item">
                    <h3>📝 使用說明</h3>
                    <p>1. 點擊"開始網絡測試"進行完整測試</p>
                    <p>2. 或選擇單獨的測試項目</p>
                    <p>3. 根據測試結果判斷網絡連接狀況</p>
                    <p>4. 如果測試失敗，請聯繫Zeabur技術支持</p>
                </div>
            `;
        };
    </script>
</body>
</html>
